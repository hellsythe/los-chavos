; Supervisor del contenedor de produccion (Coolify / Docker).
;
; Sustituye a "unitd" como PID 1 del contenedor y agrega los procesos que
; necesita Laravel para trabajar en segundo plano:
;
;   laravel-queue     -> php artisan queue:work   (jobs de la cola)
;   laravel-schedule  -> php artisan schedule:work (comandos programados)
;
; Los logs de todos los programas salen por stdout del contenedor, asi se
; ven con "docker logs" o en el panel de Coolify.
;
; Variables de entorno:
;   RUN_QUEUE_WORKER  -> "true"/"false", arranca o no el worker de colas.
;   RUN_SCHEDULER     -> "true"/"false", arranca o no el scheduler.
;   (los defaults estan en el Dockerfile)

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
; logfile a /dev/null porque en modo nodaemon supervisor ya escribe en stdout
; (si se apunta a /dev/stdout cada linea sale duplicada).
logfile=/dev/null
logfile_maxbytes=0
loglevel=info
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
nodaemon=true
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; NGINX Unit. Se conserva el entrypoint de la imagen oficial para que se
; aplique /docker-entrypoint.d/unit.json (la configuracion de Unit) la
; primera vez que arranca el contenedor.
[program:unitd]
command=/usr/local/bin/docker-entrypoint.sh unitd --no-daemon
autostart=true
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Worker de colas. Los parametros son los mismos que usa el worker de Plesk
; (stubs/plesk-supervisor-worker.conf): 3 reintentos, timeout de 2 min y
; reinicio del proceso cada hora para no acumular memoria.
; Corre como el usuario "unit" porque es el dueno de storage/ y bootstrap/cache.
[program:laravel-queue]
command=/usr/local/bin/php /app/artisan queue:work --queue=default --sleep=3 --tries=3 --timeout=120 --max-time=3600
directory=/app
user=unit
umask=002
autostart=%(ENV_RUN_QUEUE_WORKER)s
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=120
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Scheduler. Sin esto los comandos de app/Console/Kernel.php (por ejemplo
; app:load-statistics-embrodeiry, que corre diario a las 23:00) nunca se
; ejecutan en este despliegue.
[program:laravel-schedule]
command=/usr/local/bin/php /app/artisan schedule:work --no-interaction
directory=/app
user=unit
umask=002
autostart=%(ENV_RUN_SCHEDULER)s
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
